name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries for Qt (offscreen)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Install
        run: |
          python -m pip install --upgrade pip pyflakes
          python -m pip install .
      - name: Lint (pyflakes)
        run: python -m pyflakes aichat_desktop tests tools
      - name: Installed package starts
        run: python3 -m aichat_desktop --version
      - name: Tests (offscreen, no display, no real claude)
        run: python tests/run.py

  deb:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Tools for the checks
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream
      - name: Validate desktop file and AppStream data
        run: |
          desktop-file-validate packaging/aichat-desktop.desktop
          appstreamcli validate --no-net packaging/aichat-desktop.metainfo.xml
      - name: Build the .deb
        run: packaging/build-deb.sh
      - name: Check it
        run: |
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb | grep -E "usr/bin/aichat-desktop|applications/aichat-desktop.desktop|hicolor/256x256/apps/aichat-desktop.png|man1/aichat-desktop.1.gz"
      - name: Install into a scratch root, verify, purge
        run: |
          FR=$(mktemp -d); mkdir -p "$FR/var/lib/dpkg" "$FR/etc/dpkg"; touch "$FR/var/lib/dpkg/status"
          OPTS="--root=$FR --force-not-root --force-script-chrootless --force-depends --force-architecture --no-triggers"
          dpkg $OPTS -i dist/*.deb
          dpkg --root="$FR" --force-not-root -V aichat-desktop
          test -x "$FR/usr/bin/aichat-desktop"
          dpkg $OPTS -P aichat-desktop
          test ! -e "$FR/usr/lib/aichat-desktop"
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  appimage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build the AppImage
        run: packaging/build-appimage.sh
      - name: System libraries Qt needs (an AppImage bundles Qt, not the graphics stack)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: It starts
        run: APPIMAGE_EXTRACT_AND_RUN=1 dist/AI_Chat-*.AppImage --version
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
