[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aichat-desktop"
version = "0.3.0"          # keep in step with aichat_desktop/__init__.py (tests/test_features.py checks)
description = "A desktop chat window for Claude Code: live tool streaming, project folders, saved chats, permission modes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NoobFromUA" }]
keywords = ["claude", "claude-code", "chat", "pyqt6", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = ["PyQt6>=6.4"]

[project.urls]
Homepage = "https://github.com/NoobFromUA-YT/AiChat"
Source = "https://github.com/NoobFromUA-YT/AiChat"
Issues = "https://github.com/NoobFromUA-YT/AiChat/issues"
Changelog = "https://github.com/NoobFromUA-YT/AiChat/blob/main/CHANGELOG.md"

[project.gui-scripts]          # a windowed launcher: no console window on Windows, a normal script on Linux
aichat-desktop = "aichat_desktop.app:main"

[tool.setuptools]
packages = ["aichat_desktop", "aichat_desktop.assets"]

[tool.setuptools.package-data]
"aichat_desktop.assets" = ["*.png", "*.svg"]
